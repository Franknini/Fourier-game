<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>題庫編輯器</title>
<style>
:root{color-scheme:dark;--bg:#07070f;--pn:#12122a;--tx:#e8ecff;--mu:#8a90b8;--c1:#19f3ff;--bad:#ff5a6e;--warn:#ffb347}
*{box-sizing:border-box}
body{margin:auto;max-width:900px;padding:10px;background:var(--bg);color:var(--tx);font:15px/1.5 "Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif}
h1{font-size:20px;color:var(--c1);margin:4px 0}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0;align-items:center}
button{background:transparent;color:var(--c1);border:1.5px solid var(--c1);border-radius:8px;padding:6px 12px;font:inherit;cursor:pointer}
button.g{color:var(--mu);border-color:#3a3f66}button.on{box-shadow:0 0 8px #19f3ff88;background:#19f3ff18}
input,select,textarea{background:var(--pn);color:var(--tx);border:1px solid #2c3060;border-radius:8px;padding:6px 8px;font:inherit}
.ed{position:relative;height:52dvh;border:1px solid #2c3060;border-radius:8px;background:var(--pn);overflow:hidden}
.ed pre,.ed textarea{position:absolute;inset:0;margin:0;padding:8px;font:16px/22px ui-monospace,Menlo,Consolas,"Noto Sans Mono CJK TC",monospace;white-space:pre;border:0;letter-spacing:0;tab-size:2}
.ed pre{pointer-events:none;overflow:hidden;color:#cfd6ff}
.ed textarea{background:transparent;color:transparent;caret-color:#fff;resize:none;outline:none;overflow:auto;border-radius:0}
.l{display:block;height:22px;overflow:visible}.l.e{color:var(--bad);background:#ff5a6e26}.l.w{color:var(--warn);background:#ffb34726}
#msgs div{padding:3px 0;cursor:pointer}#msgs .e{color:var(--bad)}#msgs .w{color:var(--warn)}#msgs .ok{color:var(--c1);cursor:default}
small{color:var(--mu)}
#dw[hidden]{display:none}
#imp{flex:1 1 260px;height:54px;font:13px/1.3 ui-monospace,Menlo,Consolas,monospace;resize:vertical}
#dc{display:block;touch-action:none;border:1px solid #2c3060;border-radius:10px;background:#0b0b1e;margin:6px auto;max-width:100%;user-select:none;-webkit-user-select:none}

.meta input{width:130px}.meta #ma{width:150px}
</style></head><body>
<h1>題庫編輯器</h1>
<small>文字題、圖庫可直接改文字；「繪製圖形」可用工具畫出題庫圖形並輸出一行格式。改完按「複製全部」，到 GitHub 開啟同名檔案，按鉛筆圖示編輯，全選貼上，再按 Commit changes。</small>
<div class="row"><button id="tw" class="on">文字題（words.txt）</button><button id="ts" class="g">圖庫（shapes.json）</button><button id="td" class="g">繪製圖形</button></div>
<div id="tv"><div class="ed"><pre id="hl"></pre><textarea id="ta" spellcheck="false" wrap="off" autocomplete="off" autocapitalize="off"></textarea></div>
<div class="row"><button id="cp">複製全部</button><button id="dl" class="g">下載檔案</button><button id="rl" class="g">重新載入線上版本</button><span id="st"></span></div>
<div id="msgs"></div></div>
<div id="dw" hidden>
 <div class="row"><textarea id="imp" placeholder="把複製的題庫格式（shapes.json 裡的一行）貼在這裡，會自動顯示圖形，可以繼續繪圖或調整" spellcheck="false"></textarea><button id="impb">載入</button><select id="impsel" hidden></select></div>
 <div class="row meta">名稱<input id="mn" maxlength="12" placeholder="例如：貓"> 別名<input id="ma" placeholder="用 | 分隔"> 星數<select id="ml"><option value="0">0 ☆</option><option value="1">1 ★</option><option value="2">2 ★★</option><option value="3">3 ★★★</option></select> 類別<input id="mc" list="cats" placeholder="動物"><datalist id="cats"></datalist><label class="ck"><input type="checkbox" id="mg">強制同一組圓</label></div>
 <div class="row tl" id="tools"></div>
 <canvas id="dc"></canvas>
 <div class="row" id="pal"></div>
 <div class="row"><label class="ck"><input type="checkbox" id="oa" checked>手繪自動修正</label><label class="ck"><input type="checkbox" id="og">格線吸附</label><label class="ck"><input type="checkbox" id="op" checked>端點吸附</label><label class="ck"><input type="checkbox" id="oang">直線吸附角度</label><label class="ck"><input type="checkbox" id="oclose">封閉（折線/曲線）</label></div>
 <div class="row" id="acts"></div>
 <small id="dh"></small>
 <textarea id="out" readonly></textarea>
 <div class="row"><button id="ocp">複製這一行</button><button id="oadd" class="g">加入 shapes.json 分頁</button><span id="dst"></span></div>
</div>
<script>
const $=s=>document.querySelector(s),esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
function vw(t){const out=[],seen=new Map();t.split('\n').forEach((raw,i)=>{const l=raw.trim();if(!l||l[0]=='#')return;const p=l.split(/[,，]/),names=(p[0]||'').split('|').map(x=>x.trim());let bad='';
 if(!names[0])bad='缺少題目名稱';else if(names.some(x=>!x))bad='別名之間有空白項（多了一個 | ）';else if(p.length<3)bad='格式應為「名稱|別名,難度,類別」，目前只有 '+p.length+' 欄';else if(!/^\d+$/.test(p[1].trim()))bad='難度必須是 0 以上的整數，目前是「'+p[1].trim()+'」';else if(!p[2].trim())bad='類別不能空白';
 if(bad){out.push({l:i,t:'e',m:bad});return}
 if(p.length>3)out.push({l:i,t:'w',m:'第 4 欄以後的內容會被忽略'});
 if(seen.has(names[0]))out.push({l:i,t:'w',m:'與第 '+(seen.get(names[0])+1)+' 行的題目重複'});else seen.set(names[0],i)});return out}
function chk(o){if(!o||typeof o!='object'||Array.isArray(o))return'必須是 { ... } 物件';if(typeof o.n!='string'||!o.n.trim())return'缺少名稱 "n"';if(!Array.isArray(o.al)||o.al.some(x=>typeof x!='string'))return'別名 "al" 必須是文字陣列，例如 ["貓咪"]';if(!Number.isInteger(o.lv)||o.lv<0)return'難度 "lv" 必須是 0 以上的整數';if(typeof o.c!='string'||!o.c.trim())return'缺少類別 "c"';if(!Array.isArray(o.s)||!o.s.length)return'筆畫 "s" 必須是非空陣列';if(o.k!==undefined&&(!Array.isArray(o.k)||o.k.length!==o.s.length||o.k.some(v=>!Number.isInteger(v)||v<0||v>15)))return'顏色 "k" 必須是整數陣列，數量要和筆畫數一樣';if(o.g!==undefined&&(!Array.isArray(o.g)||o.g.length!==o.s.length||o.g.some(v=>!Number.isInteger(v)||v<0||v>9)))return'分組 "g" 必須是 0～9 的整數陣列，數量要和筆畫數一樣（選填，同號的筆畫會用同一組圓）';
 for(let j=0;j<o.s.length;j++){const st=o.s[j];if(!Array.isArray(st)||st.length<2)return'第 '+(j+1)+' 筆畫至少要有 2 個點';for(let k=0;k<st.length;k++){const q=st[k];if(!Array.isArray(q)||q.length!=2||!q.every(v=>typeof v=='number'&&isFinite(v)&&Math.abs(v)<10000))return'第 '+(j+1)+' 筆畫的第 '+(k+1)+' 個點必須是 [x,y] 兩個數字'}}return''}
function vs(t){const out=[],L=t.split('\n'),idx=L.map((x,i)=>x.trim()?i:-1).filter(i=>i>=0);if(!idx.length)return[{l:0,t:'e',m:'檔案是空的，至少要有 [ 和 ]'}];
 const first=idx[0],last=idx[idx.length-1];
 if(L[first].trim()!='['||L[last].trim()!=']'||idx.length<2){
  try{const a=JSON.parse(t);if(!Array.isArray(a))out.push({l:first,t:'e',m:'最外層必須是 [ ... ]'});else a.forEach((o,i)=>{const m=chk(o);if(m)out.push({l:first,t:'e',m:'第 '+(i+1)+' 筆：'+m})})}catch(e){const mm=/position (\d+)/.exec(e.message);out.push({l:mm?t.slice(0,+mm[1]).split('\n').length-1:first,t:'e',m:'JSON 格式錯誤：'+e.message})}return out}
 const body=idx.slice(1,-1),seen=new Map();
 body.forEach((li,n)=>{const raw=L[li].trim(),comma=raw.endsWith(','),txt=comma?raw.slice(0,-1):raw,isLast=n==body.length-1;
  if(!isLast&&!comma)out.push({l:li,t:'e',m:'這一行結尾缺少逗號 ,'});
  if(isLast&&comma)out.push({l:li,t:'e',m:'最後一筆結尾不能有逗號'});
  let o;try{o=JSON.parse(txt)}catch(e){out.push({l:li,t:'e',m:'JSON 格式錯誤：'+e.message});return}
  const m=chk(o);if(m){out.push({l:li,t:'e',m});return}
  if(seen.has(o.n))out.push({l:li,t:'w',m:'名稱「'+o.n+'」與第 '+(seen.get(o.n)+1)+' 行重複'});else seen.set(o.n,li)});
 return out}
const F={w:{name:'words.txt',val:'',v:vw},s:{name:'shapes.json',val:'',v:vs}};let cur='w';
function render(){const f=F[cur],ta=$('#ta'),t=ta.value;f.val=t;const errs=f.v(t).sort((a,b)=>a.l-b.l),mp=new Map();errs.forEach(e=>{if(mp.get(e.l)!='e')mp.set(e.l,e.t)});
 $('#hl').innerHTML=t.split('\n').map((x,i)=>'<span class="l'+(mp.get(i)?' '+mp.get(i):'')+'">'+esc(x)+'</span>').join('');
 $('#hl').scrollTop=ta.scrollTop;$('#hl').scrollLeft=ta.scrollLeft;
 const ne=errs.filter(e=>e.t=='e').length,nw=errs.length-ne;
 $('#st').textContent=ne?'❌ '+ne+' 個錯誤'+(nw?'、'+nw+' 個提醒':''):(nw?'⚠ '+nw+' 個提醒':'✓ 沒問題');
 $('#msgs').innerHTML=errs.map(e=>'<div class="'+e.t+'" data-l="'+e.l+'">第 '+(e.l+1)+' 行：'+esc(e.m)+'</div>').join('')||'<div class="ok">✓ 沒有發現問題</div>';fillCats()}
function load(k){fetch(F[k].name+'?'+Date.now()).then(r=>r.ok?r.text():Promise.reject()).then(t=>{F[k].val=t;if(cur==k){$('#ta').value=t;render()}fillCats()}).catch(()=>{if(cur==k)$('#st').textContent='無法從線上載入（直接開檔案時正常），可以自己貼上內容'})}
function tab(k){if(cur!='d')F[cur].val=$('#ta').value;if(k=='d'){cur='d';$('#tv').hidden=true;$('#dw').hidden=false;$('#tw').className='g';$('#ts').className='g';$('#td').className='on';resizeC();return}
 cur=k;$('#tv').hidden=false;$('#dw').hidden=true;$('#tw').className=k=='w'?'on':'g';$('#ts').className=k=='s'?'on':'g';$('#td').className='g';$('#ta').value=F[k].val;render()}
$('#ta').addEventListener('input',render);$('#ta').addEventListener('scroll',()=>{$('#hl').scrollTop=$('#ta').scrollTop;$('#hl').scrollLeft=$('#ta').scrollLeft});
$('#tw').onclick=()=>tab('w');$('#ts').onclick=()=>tab('s');$('#td').onclick=()=>tab('d');$('#rl').onclick=()=>load(cur);
$('#msgs').onclick=e=>{const d=e.target.closest('[data-l]');if(!d)return;const ta=$('#ta'),l=+d.dataset.l,ls=ta.value.split('\n');let pos=0;for(let i=0;i<l;i++)pos+=ls[i].length+1;ta.focus();ta.setSelectionRange(pos,pos+ls[l].length);ta.scrollTop=Math.max(0,(l-3)*22)};
$('#cp').onclick=()=>{const ta=$('#ta');const ok=()=>$('#st').textContent='已複製，可以貼到 GitHub 了';const fb=()=>{ta.focus();ta.select();try{document.execCommand('copy')?ok():$('#st').textContent='請長按全選後自己複製'}catch(e){$('#st').textContent='請長按全選後自己複製'}};try{navigator.clipboard.writeText(ta.value).then(ok,fb)}catch(e){fb()}};
$('#dl').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('#ta').value],{type:'text/plain'}));a.download=F[cur].name;a.click()};
function fillCats(){const s=new Set();try{F.w.val.split('\n').forEach(l=>{l=l.trim();if(l&&l[0]!='#'){const p=l.split(/[,，]/);if(p[2])s.add(p[2].trim())}})}catch(e){}try{JSON.parse(F.s.val).forEach(o=>o.c&&s.add(o.c))}catch(e){}
 const dl=$('#cats');if(dl&&dl.dataset.n!=[...s].join())(dl.dataset.n=[...s].join(),dl.innerHTML=[...s].map(c=>'<option value="'+esc(c)+'">').join(''))}
/* ================= 繪製圖形 ================= */
const COLS=['#ff3b4e','#ff9a2e','#ffe83d','#47ff8a','#3d8bff','#6a5cff','#c04dff','#9aa0b4','#b5763f','#f2e0b8','#ffffff','#19f3ff','#ff3df0','#ffe83d','#47ff8a','#ff8a3d'];
const TOOLS=[['sel','選取微調'],['free','手繪'],['line','直線'],['poly','折線'],['arc','弧線'],['circle','圓'],['ell','橢圓'],['curve','曲線'],['addpt','＋加點']];
let tool='sel',shapes=[],selI=-1,selP=-1,col=10,draft=null,drag=null,hist=[],redo=[],cv=$('#dc'),cx=cv.getContext('2d'),SZ=400,DPR=window.devicePixelRatio||1;
const HINT={sel:'點圖形選取；拖曳圓點微調位置；拖曳線條本體可整條移動。選到圓點後按「刪除點」。',free:'直接畫，放開後會自動修正成直線、圓、弧線或平滑曲線（可在下方關閉自動修正）。',line:'拖曳畫出直線。',poly:'一個個點出轉角，按「完成」或雙擊結束。',arc:'依序點三點：起點、弧線上一點、終點。',circle:'從圓心拖曳到圓邊。',ell:'從中心拖曳到角落，畫出橢圓。',curve:'點出幾個控制點，會自動連成圓滑曲線；按「完成」或雙擊結束。',addpt:'點選取中圖形的線段，就會在那裡加一個點。'};
const U2P=u=>(u+10)/120*SZ,P2U=p=>p/SZ*120-10;
function cl(a,b,t){return Math.max(a,Math.min(b,t))}
function crs(P,closed,n){const m=P.length;if(m<2)return P.slice();const out=[];const g=i=>closed?P[(i+m)%m]:P[cl(0,m-1,i)];for(let i=0;i<(closed?m:m-1);i++){const p0=g(i-1),p1=g(i),p2=g(i+1),p3=g(i+2);for(let j=0;j<n;j++){const t=j/n,t2=t*t,t3=t2*t;out.push([0,1].map(k=>.5*((2*p1[k])+(-p0[k]+p2[k])*t+(2*p0[k]-5*p1[k]+4*p2[k]-p3[k])*t2+(-p0[k]+3*p1[k]-3*p2[k]+p3[k])*t3)))}}out.push(closed?P[0]:P[m-1]);return out}
function ellp(cx0,cy0,rx,ry,n=64){const o=[];for(let i=0;i<=n;i++){const a=i/n*Math.PI*2;o.push([cx0+rx*Math.cos(a),cy0+ry*Math.sin(a)])}return o}
function circ3(a,b,c){const d=2*(a[0]*(b[1]-c[1])+b[0]*(c[1]-a[1])+c[0]*(a[1]-b[1]));if(Math.abs(d)<1e-6)return null;const ux=((a[0]**2+a[1]**2)*(b[1]-c[1])+(b[0]**2+b[1]**2)*(c[1]-a[1])+(c[0]**2+c[1]**2)*(a[1]-b[1]))/d,uy=((a[0]**2+a[1]**2)*(c[0]-b[0])+(b[0]**2+b[1]**2)*(a[0]-c[0])+(c[0]**2+c[1]**2)*(b[0]-a[0]))/d;return[ux,uy,Math.hypot(a[0]-ux,a[1]-uy)]}
function arc3(p){const[a,m,b]=p,c=circ3(a,m,b);if(!c)return[a,b];const[ux,uy,r]=c,ang=q=>Math.atan2(q[1]-uy,q[0]-ux);let a0=ang(a),am=ang(m),a1=ang(b);const norm=x=>{while(x<0)x+=2*Math.PI;while(x>=2*Math.PI)x-=2*Math.PI;return x};const dm=norm(am-a0),d1=norm(a1-a0);let sweep=dm<=d1?d1:d1-2*Math.PI;const n=Math.max(12,Math.ceil(Math.abs(sweep)*r/2.5));const o=[];for(let i=0;i<=n;i++){const t=a0+sweep*i/n;o.push([ux+r*Math.cos(t),uy+r*Math.sin(t)])}return o}
function samp(sh){const p=sh.p;switch(sh.t){case'line':return[p[0],p[1]];case'poly':return sh.closed?[...p,p[0]]:p.slice();case'curve':return crs(p,sh.closed,8);case'arc':return arc3(p);case'circle':{const R=Math.hypot(p[1][0]-p[0][0],p[1][1]-p[0][1]);return ellp(p[0][0],p[0][1],R,R)}case'ell':return ellp(p[0][0],p[0][1],Math.abs(p[1][0]-p[0][0]),Math.abs(p[2][1]-p[0][1]))}return[]}
function snapPt(u,from){let q=u.slice();if($('#op').checked){let best=3.2,bp=null;shapes.forEach((s,i)=>{if(drag&&drag.si===i)return;s.p.forEach(pt=>{const d=Math.hypot(pt[0]-u[0],pt[1]-u[1]);if(d<best){best=d;bp=pt}})});if(bp)return bp.slice()}
 if(from&&$('#oang').checked){const dx=u[0]-from[0],dy=u[1]-from[1],L=Math.hypot(dx,dy),a=Math.round(Math.atan2(dy,dx)/(Math.PI/4))*(Math.PI/4);q=[from[0]+L*Math.cos(a),from[1]+L*Math.sin(a)]}
 if($('#og').checked)q=[Math.round(q[0]/5)*5,Math.round(q[1]/5)*5];return q}
function pos(e){const r=cv.getBoundingClientRect();return[P2U((e.clientX-r.left)/r.width*SZ),P2U((e.clientY-r.top)/r.height*SZ)]}
function distSeg(p,a,b){const dx=b[0]-a[0],dy=b[1]-a[1],L=dx*dx+dy*dy||1e-9;let t=((p[0]-a[0])*dx+(p[1]-a[1])*dy)/L;t=cl(0,1,t);return Math.hypot(p[0]-a[0]-t*dx,p[1]-a[1]-t*dy)}
function hitShape(u,tol){let bi=-1,bd=tol,bs=-1;for(let i=shapes.length-1;i>=0;i--){const a=samp(shapes[i]);for(let j=0;j<a.length-1;j++){const d=distSeg(u,a[j],a[j+1]);if(d<bd){bd=d;bi=i;bs=j}}}return[bi,bs]}
function rdp(P,e){if(P.length<3)return P.slice();let md=0,mi=0;const a=P[0],b=P[P.length-1];for(let i=1;i<P.length-1;i++){const d=distSeg(P[i],a,b);if(d>md){md=d;mi=i}}return md>e?rdp(P.slice(0,mi+1),e).slice(0,-1).concat(rdp(P.slice(mi),e)):[a,b]}
function circFit(P){const n=P.length;let sx=0,sy=0,sxx=0,syy=0,sxy=0,sz=0,sxz=0,syz=0;P.forEach(([x,y])=>{const z=x*x+y*y;sx+=x;sy+=y;sxx+=x*x;syy+=y*y;sxy+=x*y;sz+=z;sxz+=x*z;syz+=y*z});
 const A=[[sxx,sxy,sx],[sxy,syy,sy],[sx,sy,n]],B=[-sxz,-syz,-sz];const det=m=>m[0][0]*(m[1][1]*m[2][2]-m[1][2]*m[2][1])-m[0][1]*(m[1][0]*m[2][2]-m[1][2]*m[2][0])+m[0][2]*(m[1][0]*m[2][1]-m[1][1]*m[2][0]);const D=det(A);if(Math.abs(D)<1e-9)return null;
 const sol=[0,1,2].map(k=>{const M=A.map((r,i)=>r.map((v,j)=>j==k?B[i]:v));return det(M)/D});const ux=-sol[0]/2,uy=-sol[1]/2,r2=ux*ux+uy*uy-sol[2];if(r2<=0)return null;const r=Math.sqrt(r2);let e=0;P.forEach(([x,y])=>e+=Math.abs(Math.hypot(x-ux,y-uy)-r));return{c:[ux,uy],r,err:e/n/r}}
function autoFix(raw){const P=rdp(raw,.4);let L=0;for(let i=1;i<raw.length;i++)L+=Math.hypot(raw[i][0]-raw[i-1][0],raw[i][1]-raw[i-1][1]);const a=raw[0],b=raw[raw.length-1],ch=Math.hypot(b[0]-a[0],b[1]-a[1]);if(L<2.5)return null;
 let dev=0;raw.forEach(p=>dev=Math.max(dev,distSeg(p,a,b)));if(ch>.8*L&&dev<.045*L+.4)return{t:'line',p:[a,b]};
