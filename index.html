<h1>傅立葉猜圖</h1>

<script>
const $=i=>document.getElementById(i),g=i=>HC&&i in HC?HC[i]:($(i).type=='checkbox'?$(i).checked:$(i).value);

{n:'愛心',al:['心','紅心'],lv:0,s:()=>[sh(t=>[16*Math.sin(t)**3,-(13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t))])]},
{n:'星星',al:['星','五角星'],lv:0,s:()=>[Array.from({length:11},(_,i)=>{const a=i*Math.PI/5-Math.PI/2,r=i%2?.4:1;return[r*Math.cos(a),r*Math.sin(a)]})]},
{n:'房子',al:['房屋','屋子','家'],lv:0,s:()=>[[[-.8,.8],[-.8,-.1],[0,-.9],[.8,-.1],[.8,.8],[-.8,.8]],[[-.2,.8],[-.2,.3],[.2,.3],[.2,.8]]]},
{n:'閃電',al:['雷電','閃光'],lv:1,s:()=>[[[.2,-1],[-.5,.1],[-.05,.1],[-.25,1],[.5,-.2],[.05,-.2],[.2,-1]]]}];
const WORDS=[['貓|貓咪',1],['蘋果',0],['腳踏車|單車|自行車',1],['吉他',1],['雨傘|傘',0],['茶杯|杯子',0],['魚',0],['樹',0],['蝸牛',2],['風車',2],['仙人掌',2]].map(([a,l])=>{const x=a.split('|');return{n:x[0],al:x.slice(1),lv:l}});
let R=null,ME='',sc=0,S={mode:'idle'},strokes=[],ci=4,cur=[],shown=[],last=-1,dr=0,lastG=0,topic=null;

const CF=.4;
function fft(re,im,inv){const n=re.length;for(let i=1,j=0;i<n;i++){let b=n>>1;for(;j&b;b>>=1)j^=b;j^=b;if(i<j){let t=re[i];re[i]=re[j];re[j]=t;t=im[i];im[i]=im[j];im[j]=t}}
 for(let l=2;l<=n;l<<=1){const a=(inv?2:-2)*Math.PI/l,wr=Math.cos(a),wi=Math.sin(a),h=l>>1;for(let i=0;i<n;i+=l){let cr=1,ci=0;for(let j=0;j<h;j++){const u=i+j,v=u+h,xr=re[v]*cr-im[v]*ci,xi=re[v]*ci+im[v]*cr;re[v]=re[u]-xr;im[v]=im[u]-xi;re[u]+=xr;im[u]+=xi;const t=cr*wr-ci*wi;ci=cr*wi+ci*wr;cr=t}}}}
function spec(xr,xi){const fr=Float64Array.from(xr),fi=Float64Array.from(xi);fft(fr,fi,0);const cs=[];for(let k=-K;k<=K;k++){const m=(k+N)%N,re=fr[m]/N,im=fi[m]/N;cs.push({k,re,im,a:Math.hypot(re,im)})}return cs}
function fill(zr,zi,m,nt,iters,xr0,xi0){const xr=Float64Array.from(xr0),xi=Float64Array.from(xi0),fr=new Float64Array(N),fi=new Float64Array(N),am=new Float64Array(N);
 for(let it=0;it<iters;it++){fr.set(xr);fi.set(xi);fft(fr,fi,0);for(let i=0;i<N;i++){fr[i]/=N;fi[i]/=N;am[i]=fr[i]*fr[i]+fi[i]*fi[i]}
  const th=Float64Array.from(am).sort()[Math.max(0,N-nt-1)];for(let i=1;i<N;i++)if(am[i]<=th){fr[i]=0;fi[i]=0}
  fft(fr,fi,1);for(let i=0;i<N;i++){if(m[i]){xr[i]=zr[i];xi[i]=zi[i]}else{xr[i]=fr[i];xi[i]=fi[i]}}}
 return[xr,xi]}
const CT=Float64Array.from({length:N},(_,i)=>Math.cos(2*Math.PI*i/N)),ST=Float64Array.from({length:N},(_,i)=>Math.sin(2*Math.PI*i/N));
function devs(a,c0,zr,zi,m,cap,ev){const yr=new Float64Array(N).fill(c0.re),yi=new Float64Array(N).fill(c0.im),vi=[];for(let i=0;i<N;i++)if(m[i])vi.push(i);
 const e=new Float64Array(vi.length),out=new Float64Array(cap+1).fill(NaN),pc=()=>{for(let q=0;q<vi.length;q++){const i=vi[q];e[q]=Math.hypot(yr[i]-zr[i],yi[i]-zi[i])}return Float64Array.from(e).sort()[Math.floor(.96*(e.length-1))]};
 out[0]=pc();for(let n=1;n<=cap&&n<=a.length;n++){const c=a[n-1],k=c.k;for(let i=0;i<N;i++){const id=((k*i)%N+N)%N;yr[i]+=c.re*CT[id]-c.im*ST[id];yi[i]+=c.re*ST[id]+c.im*CT[id]}if(n%ev==0)out[n]=pc()}
 return out}
const sortCs=cs=>cs.filter(c=>c.k).sort(g('srt')=='amp'?(p,q)=>q.a-p.a:(p,q)=>Math.abs(p.k)-Math.abs(q.k)||p.k-q.k);
function order(st){if(st.length<2)return st;const q=st.map(s=>({p:s.p,c:s.c})),out=[q.shift()];while(q.length){const l=out[out.length-1].p,e=l[l.length-1];let bi=0,bf=true,bd=1e18;q.forEach((s,i)=>{const a=Math.hypot(s.p[0][0]-e[0],s.p[0][1]-e[1]),b=Math.hypot(s.p[s.p.length-1][0]-e[0],s.p[s.p.length-1][1]-e[1]);if(a<bd){bd=a;bi=i;bf=true}if(b<bd){bd=b;bi=i;bf=false}});const s=q.splice(bi,1)[0];out.push(bf?s:{p:s.p.slice().reverse(),c:s.c})}return out}
function rsm(p,step){if(p.length<2)p=[p[0],p[0]];const L=[0];for(let i=1;i<p.length;i++)L.push(L[i-1]+Math.hypot(p[i][0]-p[i-1][0],p[i][1]-p[i-1][1]));const T=L[L.length-1],m=Math.min(60,Math.max(2,Math.ceil(T/step)+1)),o=[];let j=0;for(let i=0;i<m;i++){const s=T*i/(m-1);while(j<L.length-2&&L[j+1]<s)j++;const u=(s-L[j])/((L[j+1]-L[j])||1);o.push([p[j][0]+(p[j+1][0]-p[j][0])*u,p[j][1]+(p[j+1][1]-p[j][1])*u])}return{pts:o,len:T}}
